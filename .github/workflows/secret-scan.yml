name: 凭据扫描

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 扫描提交历史中的凭据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全量历史：仅扫描最新提交会漏掉历史泄露。
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # 只报告，不因发现凭据而失败时请改为 false；默认失败以阻止合入。
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
