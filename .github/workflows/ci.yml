name: 持续集成

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 服务端与桌面端：必须用 Windows 运行器
  #
  # 原因：VisiCore.slnx 包含 WPF 项目（VideoPlatform.Desktop、VideoPlatform.Updater，
  # 目标框架 net10.0-windows，UseWPF=true）以及 LibVLCSharp。WPF 无法在 Linux 上构建，
  # 因此 `dotnet build VisiCore.slnx` 只能在 Windows 运行器上执行。
  # 用 Linux 跑会得到 "NETSDK1100: To build a project targeting Windows on this
  # operating system, set the EnableWindowsTargeting property to true" 之类的失败，
  # 且即使绕过也无法运行桌面测试。
  # ────────────────────────────────────────────────────────────────────────
  server:
    name: 服务端与桌面端（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 遵循仓库 global.json 固定的 SDK 版本（10.0.400，rollForward=latestFeature）。
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 还原依赖
        run: dotnet restore VisiCore.slnx

      # Directory.Build.props 已启用 TreatWarningsAsErrors，因此"0 警告"是硬门禁。
      - name: 构建（Release，警告即错误）
        run: dotnet build VisiCore.slnx -c Release --no-restore

      # 区间说明：以下各套件的期望值来自本地实测基线（2026-10-14）。
      # 数字写进注释便于快速判断"是回归还是环境差异"。

      - name: Worker 单元测试（51 通过 / 30 跳过，跳过项为需数据库的集成测试）
        run: dotnet test tools/VideoPlatform.Worker.Tests/VideoPlatform.Worker.Tests.csproj -c Release --no-build --nologo

      # 排除 VisualSmokeTests：该用例通过 RenderTargetBitmap 离屏渲染并断言
      # "颜色数 > 15"，需要真实显示表面。
      # 实测证据：2026-10-09 控制台会话运行通过（截图 100~170 KB，共 29 张）；
      # 2026-10-14 在 RDP 会话（SESSIONNAME=RDP-Tcp#0）运行，产出 4 KB 空白图、
      # 颜色数为 1 而失败。GitHub Actions 运行器同样无交互式桌面，会同样失败。
      # 该用例在**真实控制台会话**上仍有价值，故保留在仓库、仅排除于 CI。
      - name: 桌面端测试（173 通过 / 1 跳过；排除需真实显示表面的视觉冒烟用例）
        run: >
          dotnet test tools/VideoPlatform.Desktop.Tests/VideoPlatform.Desktop.Tests.csproj
          -c Release --no-build --nologo
          --filter "Category!=Package&Category!=Candidate&FullyQualifiedName!~VisualSmokeTests"

      - name: 海康适配器契约测试（17/17）
        run: dotnet run --project tools/VideoPlatform.Adapter.Tests -c Release --no-build

      - name: 中维适配器契约测试（6/6）
        run: dotnet run --project tools/VideoPlatform.Jovision.Tests -c Release --no-build

      # 该宿主会从真实 API 路由导出 OpenAPI 并断言契约完整性（18 项）。
      # 它不写入仓库内文件，只写入被忽略的 .runtime 目录，因此可安全在 CI 运行。
      - name: 客户端与 OpenAPI 契约检查（18 项）
        run: dotnet run --project tools/VideoPlatform.ClientGenerator/Tests -c Release --no-build

      # 集成回归需要独立 PostgreSQL 与运行中的 API；缺少环境时会输出 SKIP 并以 0 退出
      # （见 P0 修复）。此处运行它，一是验证跳过路径本身有效，
      # 二是将来若接入数据库服务容器，它即可自动开始真正执行。
      - name: 集成回归（无数据库时应输出 SKIP 并成功退出）
        run: dotnet run --project tools/VideoPlatform.IntegrationTests -c Release --no-build

  # ────────────────────────────────────────────────────────────────────────
  # 管理端前端：Linux 运行器即可
  # ────────────────────────────────────────────────────────────────────────
  web:
    name: 管理端前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # README 要求 Node.js 22 或更新的受支持 LTS。
          node-version: 22
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: 安装依赖
        run: npm ci

      # `npm run build` 含 `vue-tsc --noEmit`，因此这一步同时是类型检查门禁。
      - name: 构建（含类型检查）
        run: npm run build

      - name: 单元测试（91 通过）
        run: npm test

  # ────────────────────────────────────────────────────────────────────────
  # 数据库集成测试：需 PostgreSQL 服务容器
  #
  # ⚠️ 诚实声明：本工作流在本地**无法验证**——评审环境没有可用的 PostgreSQL
  #    （主机 5432 未监听，Docker 守护进程未运行），因此以下环境变量与期望值
  #    仅依据测试宿主代码（DatabaseHarness.CreateAsync 读取 WORKER_TEST_DATABASE_URL；
  #    Admin 宿主读取 ADMIN_TEST_DATABASE_URL）推断。
  #    若本作业在 CI 首次运行时失败，那是**真实信息**（这些用例从未在 CI 中跑过，
  #    此前一律被 SKIP），应据实修复或调整，不要直接删除本作业来"变绿"。
  # ────────────────────────────────────────────────────────────────────────
  database:
    name: 数据库集成测试（PostgreSQL）
    runs-on: ubuntu-latest
    # 该作业需要 net10.0 服务端项目；WPF 项目不在其中。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_USER: visicore
          POSTGRES_DB: visicore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visicore -d visicore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: Host=127.0.0.1;Port=5432;Database=visicore_test;Username=visicore;Password=ci-postgres
      ADMIN_TEST_DATABASE_URL: Host=127.0.0.1;Port=5432;Database=visicore_test;Username=visicore;Password=ci-postgres
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 只构建需要的服务端项目（避免在 Linux 上碰到 WPF 目标框架）。
      - name: 构建服务端测试宿主
        run: |
          dotnet build tools/VideoPlatform.Worker.Tests/VideoPlatform.Worker.Tests.csproj -c Release --nologo
          dotnet build tools/VideoPlatform.Admin.Tests/VideoPlatform.Admin.Tests.csproj -c Release --nologo

      - name: Worker 数据库集成测试
        run: dotnet test tools/VideoPlatform.Worker.Tests/VideoPlatform.Worker.Tests.csproj -c Release --no-build --nologo

      - name: 管理端数据库回归
        run: dotnet run --project tools/VideoPlatform.Admin.Tests -c Release --no-build
