server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/ssl/video-platform.crt;
    ssl_certificate_key /etc/nginx/ssl/video-platform.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/video-platform-v2/current/web;
    index index.html;
    client_max_body_size 1024m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5082;
    }
    location /api/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /hubs/v2/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }
    location ~ ^/media/(live|playback)/[A-Za-z0-9_-]+\.live\.(flv|ts)$ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /media/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        return 404;
    }
    location /internal/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        return 404;
    }
    location /assets/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /desktop-only.html {
        add_header Cache-Control "no-store" always;
    }
    location / {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        try_files $uri $uri/ /index.html;
    }
    error_page 403 /desktop-only.html;
}
