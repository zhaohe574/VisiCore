server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/ssl/video-platform.crt;
    ssl_certificate_key /etc/nginx/ssl/video-platform.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/video-platform/web-admin;
    index index.html;

    location = /health {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /desktop-only.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($http_user_agent ~* "(android|iphone|ipad|ipod|windows\s+phone|blackberry|opera\s+(mini|mobi)|mobile)") { return 403; }
        try_files $uri $uri/ /index.html;
    }

    error_page 403 /desktop-only.html;
}
